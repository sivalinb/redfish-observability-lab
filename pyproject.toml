[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "redfish-observability-lab"
version = "0.1.0"
description = "An animated Redfish and OpenTelemetry learning lab built with Python and Gradio"
requires-python = ">=3.11"
dependencies = [
  "gradio==5.49.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
redfish-lab = "redfish_lab.app:main"

[tool.setuptools.packages.find]
include = ["redfish_lab*"]

[tool.setuptools.package-data]
redfish_lab = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
