name: Python lab tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
  observability-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'httpx>=0.28,<1'
      - name: Start the optional observability stack
        run: docker compose up --build -d
      - name: Verify all three signals reach their backends
        run: python tests/stack_smoke.py
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop the stack
        if: always()
        run: docker compose down
